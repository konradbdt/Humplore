<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kontakt - Meine SocialMedia Plattform</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/humplore-redesign.css">
</head>
<body class="page-legal page-contact">
    <header>
        <h1>Kontakt</h1>
        <nav>
        </nav>
    </header>

    <main>
        <section>
            <h2>Schreibe uns</h2>
            <p>Nutze das Formular, um uns eine Nachricht zu senden:</p>
            <form action="#" method="post">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>
                
                <label for="email">E-Mail:</label><br>
                <input type="email" id="email" name="email" required><br><br>
                
                <label for="message">Nachricht:</label><br>
                <textarea id="message" name="message" rows="5" required></textarea><br><br>
                
                <button type="submit">Senden</button>
            </form>
        </section>
    </main>

    <footer>

            <li><a href="ueber-uns.html">Über Uns</a></li>
            <li><a href="agbs.html">AGBs</a></li>
        </ul>
    </footer>
</body>
</html>
